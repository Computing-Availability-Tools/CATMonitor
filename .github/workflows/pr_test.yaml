name: CI

# Single entry point: one push/PR only triggers this one workflow.
# Calls reusable workflows (hub-and-spoke, same pattern as DemonCAT).
#
# Light layer (every push/PR, GitHub-hosted ubuntu):
#   lint    — pre-commit (gofmt / go vet / hygiene / typos) + PR title check
#   test    — go test ./... (536 functions / 39 packages)
#   e2e     — make test-e2e (41 test cases, no-hardware degradation;
#             TC-027/TC-031 skip on non-root runners)
#
# Full NPU layer (only on the home repo, gated by PR 'ready' label or push):
#   e2e-npu — make test-e2e on the self-hosted 910B4 runner (all 41 cases
#             incl. root scenarios + real NPU/BMC data) + dcmi CGo build check.
#
# Coverage layer (same gating as the NPU layer):
#   coverage — go test -coverprofile + total in the step summary + clickable
#              HTML report artifact (Go toolchain built-ins, no external
#              service). Advisory: ci-gate reports it but does not block.
#
# ci-gate aggregates every job into one verdict: lint/test/e2e must succeed;
# e2e-npu must succeed when it runs (skipped is fine); coverage is advisory.
# When enabling branch protection, mark ONLY the "CI Gate" check as required.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - edited  # re-validate PR title after edits

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_pre_commit.yaml

  test:
    name: Test
    uses: ./.github/workflows/_unit_test.yaml

  e2e:
    name: E2E
    uses: ./.github/workflows/_e2e_test.yaml

  # Full NPU coverage: only on the home repository (self-hosted runner is
  # private infrastructure — fork PRs must not execute code on it) and only
  # when explicitly requested (push to develop/main, or PR labeled ready).
  e2e-npu:
    name: E2E NPU (self-hosted 910B4)
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && github.repository == 'Computing-Availability-Tools/CATMonitor'
          && (github.event_name == 'push'
              || contains(github.event.pull_request.labels.*.name, 'ready')) }}
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["self-hosted", "npu-server", "ARM64"]'
      dcmi-build: true
      timeout-minutes: 30

  # Coverage on the full layer only (same gating as e2e-npu): the plain PR
  # path already runs the tests; this re-runs them instrumented to produce
  # the merged profile + HTML report. Advisory — never blocks the gate.
  coverage:
    name: Coverage
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && github.repository == 'Computing-Availability-Tools/CATMonitor'
          && (github.event_name == 'push'
              || contains(github.event.pull_request.labels.*.name, 'ready')) }}
    uses: ./.github/workflows/_unit_test.yaml
    with:
      coverage: true

  # Single aggregated verdict for branch protection: mark only "CI Gate" as
  # the required check (marking the conditional e2e-npu required would leave
  # unlabeled PRs stuck in "expected" forever). if: always() so a verdict is
  # reported even when dependencies failed or were skipped.
  ci-gate:
    name: CI Gate
    needs: [lint, test, e2e, e2e-npu, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          E2EN: ${{ needs.e2e-npu.result }}
          COV: ${{ needs.coverage.result }}
        run: |
          set -eu
          echo "=== CI Gate Summary ==="
          echo "lint:     ${LINT}"
          echo "test:     ${TEST}"
          echo "e2e:      ${E2E}"
          echo "e2e-npu:  ${E2EN}"
          echo "coverage: ${COV} (advisory)"
          # lint/test/e2e: must succeed (skipped allowed for future guards)
          for r in "${LINT}" "${TEST}" "${E2E}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Required job did not succeed: ${r}"; exit 1 ;;
            esac
          done
          # e2e-npu: must succeed when it runs; not triggered (skipped) is fine
          case "${E2EN}" in
            success|skipped) ;;
            *) echo "::error::E2E NPU did not succeed: ${E2EN}"; exit 1 ;;
          esac
          # coverage: advisory only — reported, never blocks
          echo "=== CI Gate: PASSED ==="
