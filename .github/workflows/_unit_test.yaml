name: Unit Tests

# Reusable unit-test workflow (called by pr_test.yaml).
# Runs go test ./... (536 test functions / 39 packages, no hardware needed).

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout; empty = event default"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: go test (39 packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test ./...
