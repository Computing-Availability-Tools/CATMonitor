name: Pre-Commit

# Reusable lint workflow (called by pr_test.yaml).
# Runs gofmt / go vet / file hygiene / typos via the pre-commit framework,
# plus a Conventional Commits PR-title check (same rule as DemonCAT).

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (branch/tag/sha); empty = event default (PR merge ref / push ref)"
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    name: pre-commit (gofmt / vet / hygiene / PR title)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate PR title (conventional commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          [ -n "$PR_TITLE" ] || { echo "::error::PR title is empty"; exit 1; }
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|merge)(\([^)]+\))?: .+'
          printf '%s\n' "$PR_TITLE" | grep -qE "$pattern" \
            || { echo "::error::PR title must follow Conventional Commits: '<type>(<scope>): <desc>'"; \
                 echo "::error::Allowed types: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|merge"; \
                 echo "::error::Got: $PR_TITLE"; exit 1; }
          echo "PR title OK: $PR_TITLE"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit
        run: |
          # Register problem matchers so actionlint/shellcheck findings become
          # clickable file:line annotations on the PR (same as DemonCAT).
          echo "::add-matcher::.github/workflows/matchers/actionlint.json"
          echo "::add-matcher::.github/workflows/matchers/shellcheck.json"
          pre-commit run --all-files --show-diff-on-failure
