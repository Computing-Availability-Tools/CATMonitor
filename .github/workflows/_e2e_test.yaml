name: E2E Test

# Reusable e2e workflow (called by pr_test.yaml / schedule_nightly_test.yaml).
# Runs make test-e2e (41 test cases / 25 test functions, black-box Go).
#
# Runner selection:
#   - default: ubuntu-latest (GitHub-hosted, no hardware — collectors degrade)
#   - NPU: ["self-hosted", "npu-server", "ARM64"] (real 910B4 host:
#     npu-smi/hccn_tool/DCMI header/BMC all present, runs as root so
#     TC-027 tmpfs and TC-031 RunAsUser scenarios execute fully)
#
# dcmi-build: additionally verify the CGo DCMI build compiles
#   (go build -tags dcmi) — only meaningful on a host with the CANN SDK.
#
# Self-hosted checkout retry: NPU runner networks can be flaky to
# github.com:443 (same mitigation as DemonCAT's _e2e_test.yaml).
#
# Failure diagnostics: full output is teed to e2e_run.log; failed cases are
# re-echoed as ::error:: annotations (visible directly on the PR Checks UI),
# counts go to the step summary, and the log is uploaded as an artifact only
# on failure (web logs on self-hosted runners can be truncated by
# disconnects — the artifact is the durable copy).

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout; empty = event default"
        type: string
        default: ""
      runner:
        description: "JSON array of runs-on labels, e.g. [\"ubuntu-latest\"] or [\"self-hosted\",\"npu-server\",\"ARM64\"]"
        type: string
        default: '["ubuntu-latest"]'
      dcmi-build:
        description: "Verify go build -tags dcmi compiles (needs CANN SDK)"
        type: boolean
        default: false
      timeout-minutes:
        description: "Job timeout in minutes"
        type: number
        default: 20

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (41 test cases${{ inputs.dcmi-build && ' + dcmi build' || '' }})
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        id: co1
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
        # Self-hosted runners can have flaky github.com connectivity: retry.
        continue-on-error: ${{ contains(inputs.runner, 'self-hosted') }}

      - name: Checkout (retry 1/2)
        if: ${{ contains(inputs.runner, 'self-hosted') && steps.co1.outcome == 'failure' }}
        id: co2
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Checkout (retry 2/2)
        if: ${{ contains(inputs.runner, 'self-hosted') && steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Verify dcmi CGo build (CANN SDK present)
        if: ${{ inputs.dcmi-build }}
        run: |
          # The DCMI header must exist for -tags dcmi to compile.
          test -f /usr/local/Ascend/driver/include/dcmi_interface_api.h \
            || { echo "::error::DCMI header not found; is this an NPU host?"; exit 1; }
          go build -tags dcmi -o /dev/null ./cmd/catmonitor

      - name: Run e2e scenarios
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee e2e_run.log

      - name: Annotate failed test cases
        if: failure()
        run: |
          # GHA only parses ::error:: commands from real-time step stdout;
          # the go test output went through tee, re-echo failed cases here
          # so they show up directly on the PR Checks UI.
          grep -- '--- FAIL:' e2e_run.log 2>/dev/null | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: E2E summary
        if: always()
        run: |
          PASS_CNT=$(grep -c '^--- PASS:' e2e_run.log 2>/dev/null || true)
          FAIL_CNT=$(grep -c '^--- FAIL:' e2e_run.log 2>/dev/null || true)
          SKIP_CNT=$(grep -c '^--- SKIP:' e2e_run.log 2>/dev/null || true)
          TOTAL=$((PASS_CNT + FAIL_CNT + SKIP_CNT))
          {
            echo "## E2E Summary"
            if [ "$TOTAL" -eq 0 ]; then
              echo "_No test results found — the job failed before reaching the test stage (checkout / vet / compile)._"
            else
              echo "| Result | Count |"
              echo "|---|---|"
              echo "| Passed | ${PASS_CNT} |"
              echo "| Failed | ${FAIL_CNT} |"
              echo "| Skipped | ${SKIP_CNT} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Both e2e and e2e-npu (pr_test.yaml) call this reusable workflow
          # within the same run — derive distinct artifact names from the
          # runner labels instead of adding an input callers must pass.
          name: ${{ contains(inputs.runner, 'self-hosted') && 'e2e-npu-log' || 'e2e-log' }}
          path: e2e_run.log
          if-no-files-found: ignore
          retention-days: 7
