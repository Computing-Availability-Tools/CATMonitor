        priority: Medium
      - name: voltage
        priority: Medium
      - name: aicore_voltage
        priority: Medium
      - name: hybrid_voltage
        priority: Medium
      - name: cpu_voltage
        priority: Medium
      - name: ddr_voltage
        priority: Medium
