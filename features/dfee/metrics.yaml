  - component: cpu
    interval: 1s
    metrics:
      - name: user_time
        priority: Medium
      - name: nice_time
        priority: Medium
      - name: system_time
        priority: Medium
      - name: idle_time
        priority: Medium
      - name: iowait_time
        priority: Medium
      - name: irq_time
        priority: Medium
      - name: softirq_time
        priority: Medium
      - name: steal_time
        priority: Medium
      - name: load_average
        priority: High
      - name: power
        priority: Medium
  - component: memory
    interval: 2s
    metrics:
      - name: usage_detail
        priority: Medium
      - name: swap_detail
        priority: Medium
  - component: disk
    interval: 2s
    metrics:
      - name: throughput
        priority: Medium
      - name: read_latency
        priority: Medium
      - name: write_latency
        priority: Medium
      - name: iops
        priority: Medium
  - component: network
    interval: 1s
    metrics:
      - name: rx_bytes_total
        priority: Medium
      - name: tx_bytes_total
        priority: Medium
  - component: chassis
    interval: 3s
    metrics:
      - name: power
        priority: Medium
      - name: inlet_temp
        priority: Medium
      - name: outlet_temp
        priority: Medium
      - name: fan_speed
        priority: Medium
      - name: fan_power
        priority: Medium
