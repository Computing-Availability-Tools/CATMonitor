<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATMonitor 设备健康度</title>
  <script>
    // Set data-theme before the stylesheet loads to avoid a flash of the
    // wrong theme. Manual choice (localStorage) wins; otherwise follow the
    // OS preference.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="#/" class="brand-link">CATMonitor</a>
      <span class="subtitle">设备健康度</span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="topright">
      <div class="scorepill" id="scorePill" title="整体健康度">
        <span class="pill-dot" id="pillDot"></span>
        <span id="pillScore">--</span>
        <span class="pill-grade" id="pillGrade">--</span>
      </div>
      <div class="controls">
        <label>刷新间隔 <input type="number" id="intervalInput" min="1" step="1" value="5"> 秒</label>
        <button id="applyBtn" class="btn">应用</button>
        <button id="refreshBtn" class="btn btn-primary">立即刷新</button>
        <button id="themeBtn" class="btn" title="切换深浅主题">🌙</button>
        <label class="auto"><input type="checkbox" id="autoToggle" checked> 自动</label>
      </div>
    </div>
  </header>

  <div id="banner" class="banner hidden" role="status"></div>

  <main id="page" class="page"></main>

  <script src="/static/app.js"></script>
</body>
</html>
