# CATMonitor Configuration File

server:
  # Server type: auto | cpu_only | accelerated
  # auto: detect GPU/NPU automatically
  type: auto

collectors:
  chassis:
    enabled: true
    interval: 3s
  cpu:
    enabled: true
    interval: 3s
  memory:
    enabled: true
    interval: 3s
  disk:
    enabled: true
    interval: 5s
  gpu:
    enabled: true
    interval: 3s
  npu:
    enabled: true
    interval: 3s
  network:
    enabled: true
    interval: 3s

storage:
  data_dir: /var/lib/catmonitor/data
  max_file_age: 168h
  rotation: daily

health:
  enabled: true
  interval: 5s
  weight_scheme: auto

  stress:
    enabled: false
    web_enabled: false
    script_path: features/health/stress/benchmark_check.sh
    report_path: features/web/data/stress-latest.json
    default_benchmarks: [stream]
    benchmarks:
      stream: { enabled: false, timeout: 30m }
      hpl: { enabled: false, timeout: 2h }
      hpcg: { enabled: false, result_dir: /root/haoran/hpcg-3.1/build_Kunpeng_MPI_OMP/bin, timeout: 3m }
