# Complete CPU + NPU Reliability Stress example.
#
# The daemon owns orchestration and uses docker exec to invoke fixed typed
# plugins in the two workload containers. CLI and Web cannot edit commands,
# executable paths, container bindings, or workload environment variables.
stress:
  enabled: true
  web_enabled: true
  control_socket: /run/catmonitor/control.sock
  report_path: /var/lib/catmonitor/stress/stress-latest.json
  default_benchmarks: [stream]
  executor:
    type: docker_exec
    docker_binary: /usr/bin/docker
    docker_socket: /var/run/docker.sock
  benchmarks:
    stream: { enabled: true, plugin: stream, container: catmonitor-stress-cpu, user: "65532:65532", timeout: 1m }
    hpl: { enabled: true, plugin: hpl, container: catmonitor-stress-cpu, user: "65532:65532", timeout: 10m }
    hpcg: { enabled: true, plugin: hpcg, container: catmonitor-stress-cpu, user: "65532:65532", timeout: 3m }
    # Prefer generate_stress_deployment.sh: it resolves the complete logical
    # allowlist from the mapped device count. This static example deliberately
    # authorizes only logical 0; replace it with this deployment's verified IDs.
    # Enabling capabilities never starts a job or creates a reference. Keep the
    # Web operator API on a trusted management network (no authentication/RBAC).
    npu_burn:
      enabled: true
      plugin: npu_burn
      container: catmonitor-stress-npu
      timeout: 2h
      allowed_npu_devices: [0]
      allowed_npu_models: [gpt3, llama2]
      allow_npu_reference_generation: true
