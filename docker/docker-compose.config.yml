# Read one administrator-owned CATMonitor configuration in every control-plane
# profile. The file is mounted read-only into the daemon and Web containers;
# DFeE does not read CATMonitor YAML.
services:
  catmonitor:
    volumes:
      - type: bind
        source: ${CATMONITOR_CONFIG:?set CATMONITOR_CONFIG to the absolute CATMonitor YAML path}
        target: /etc/catmonitor/catmonitor.yaml
        read_only: true
        bind:
          create_host_path: false

  web:
    volumes:
      - type: bind
        source: ${CATMONITOR_CONFIG:?set CATMONITOR_CONFIG to the absolute CATMonitor YAML path}
        target: /etc/catmonitor/catmonitor.yaml
        read_only: true
        bind:
          create_host_path: false
