collectors:
  chassis:
    enabled: true
    interval: 3s
  cpu:
    enabled: true
    interval: 3s
  memory:
    enabled: true
    interval: 3s
  disk:
    enabled: true
    interval: 5s
  gpu:
    enabled: true
    interval: 3s
  npu:
    enabled: true
    interval: 3s
  network:
    enabled: true
    interval: 3s

storage:
  data_dir: /var/lib/catmonitor/data
  max_file_age: 168h
  rotation: daily

collection:
  min_priority: medium

features: [web, dfee, health]

snapshot:
  enabled: true
  dir: /var/lib/catmonitor/snapshot

# Reliability Stress is explicit and disabled by default. The daemon owns the
# controller and invokes only fixed plugins in preconfigured workload
# containers. CLI/Web are clients of /run/catmonitor/control.sock.
stress:
  enabled: false
  web_enabled: false
  control_socket: /run/catmonitor/control.sock
  report_path: /var/lib/catmonitor/stress/stress-latest.json
  default_benchmarks: [stream]
  executor:
    type: docker_exec
    docker_binary: /usr/bin/docker
    docker_socket: /var/run/docker.sock
  benchmarks:
    stream:
      enabled: false
      plugin: stream
      container: catmonitor-stress-cpu
      user: "65532:65532"
      timeout: 1m
    hpl:
      enabled: false
      plugin: hpl
      container: catmonitor-stress-cpu
      user: "65532:65532"
      timeout: 2h
    hpcg:
      enabled: false
      plugin: hpcg
      container: catmonitor-stress-cpu
      user: "65532:65532"
      timeout: 3m
    npu_burn:
      enabled: false
      plugin: npu_burn
      container: catmonitor-stress-npu
      timeout: 30m
faultsub:
  enabled: false
  rest_addr: ":19321"

straggler_output:
  enabled: false
  data_dir: /var/lib/catmonitor/straggler
  retention: 360h
  flush_interval: 60s
