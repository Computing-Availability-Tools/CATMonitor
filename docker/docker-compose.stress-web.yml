# Optional loopback-only operator Web for reliability stress Run/Cancel.
# Merge with docker-compose.yml, docker-compose.config.yml,
# docker-compose.stress.yml and docker-compose.stress-npuburn.yml on Ascend
# nodes. CATMONITOR_NPU_OUTPUT_DIR must match the result_directory recorded in
# the installed NPU adapter profile.
services:
  stress-web:
    container_name: catmonitor-stress-web
    image: ${CATMONITOR_IMAGE:-catmonitor-generic}
    network_mode: host
    entrypoint: /usr/local/bin/web
    command: >
      -addr=127.0.0.1:29592
      -snapshot-dir=/var/lib/catmonitor/snapshot
      -config=/etc/catmonitor/catmonitor.yaml
    group_add:
      - "65532"
    volumes:
      - snapshot:/var/lib/catmonitor/snapshot:ro
      - type: bind
        source: ${CATMONITOR_CONFIG:?set CATMONITOR_CONFIG to the absolute CATMonitor YAML path}
        target: /etc/catmonitor/catmonitor.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CATMONITOR_STRESS_ROOT:-/opt/catmonitor/stress}
        target: /opt/catmonitor/stress
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CATMONITOR_STRESS_STATE_DIR:-/var/lib/catmonitor/stress}
        target: /var/lib/catmonitor/stress
        bind:
          create_host_path: false
      - type: volume
        source: catmonitor_stress_socket
        target: /run/catmonitor-stress
      - type: bind
        source: ${CATMONITOR_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: ${CATMONITOR_NPU_OUTPUT_DIR:?set CATMONITOR_NPU_OUTPUT_DIR to the NPU result directory}
        target: ${CATMONITOR_NPU_OUTPUT_DIR:?set CATMONITOR_NPU_OUTPUT_DIR to the NPU result directory}
        bind:
          create_host_path: false
    depends_on:
      catmonitor:
        condition: service_started
      cpu-stress-runner:
        condition: service_healthy
    restart: unless-stopped
