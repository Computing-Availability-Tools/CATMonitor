services:
  # 1. daemon: collects metrics, writes snapshots, runs Prometheus exporter.
  #    Also hosts faultsub REST API and straggler KPI output (if enabled).
  catmonitor:
    image: ${CATMONITOR_IMAGE:-catmonitor-generic}
    privileged: true
    network_mode: host         # share host network namespace (see real NICs in /sys/class/net)
    pid: host                  # share host PID namespace (read host /proc/1/mounts for disk space)
    volumes:
      # Host mounts for accurate disk space metrics in container mode:
      # / gives statfs access to host filesystems; host /proc/1/mounts is read
      # via pid:host (no bind-mount needed). Without these, disk metrics reflect
      # container bind mounts instead of host filesystems.
      - /:/host:ro
      - /etc/os-release:/etc/os-release:ro
      # Override config files (baked into image at /etc/catmonitor/ and /features/)
      # Uncomment and adjust paths to customize:
      # - ./catmonitor.yaml:/etc/catmonitor/catmonitor.yaml:ro
      # - ./metrics.yaml:/etc/catmonitor/metrics.yaml:ro
      # - ./features/web/metrics.yaml:/features/web/metrics.yaml:ro
      # - ./features/dfee/metrics.yaml:/features/dfee/metrics.yaml:ro
      # - ./features/health/metrics.yaml:/features/health/metrics.yaml:ro
      - snapshot:/var/lib/catmonitor/snapshot
      - data:/var/lib/catmonitor/data
      - straggler:/var/lib/catmonitor/straggler
    restart: unless-stopped

  # 2. web: standalone read-only dashboard. Reads snapshots from daemon.
  web:
    image: ${CATMONITOR_IMAGE:-catmonitor-generic}
    network_mode: host
    entrypoint: /usr/local/bin/web
    command: >
      -addr=127.0.0.1:19322
      -snapshot-dir=/var/lib/catmonitor/snapshot
      -config=/etc/catmonitor/catmonitor.yaml
    volumes:
      - snapshot:/var/lib/catmonitor/snapshot:ro
    depends_on:
      - catmonitor
    restart: unless-stopped

  # 3. dfee: energy-efficiency SPA + API. Reads snapshots from daemon.
  #    Optional: enable Prometheus exporter (:9333) and/or CSV output.
  dfee:
    image: ${CATMONITOR_IMAGE:-catmonitor-generic}
    network_mode: host
    entrypoint: /usr/local/bin/dfee
    command: >
      -addr=:19323
      -snapshot-dir=/var/lib/catmonitor/snapshot
      -exporter=enabled
      -exporter-port=9333
      -csv=disabled
      -csv-dir=/var/lib/catmonitor/csv
      -csv-interval=10s
    volumes:
      - snapshot:/var/lib/catmonitor/snapshot:ro
      - csv:/var/lib/catmonitor/csv
    depends_on:
      - catmonitor
    restart: unless-stopped

volumes:
  snapshot:    # daemon writes, web/dfee read
  data:        # JSONL historical data
  csv:         # dfee CSV output (optional)
  straggler:   # straggler KPI files (optional)
