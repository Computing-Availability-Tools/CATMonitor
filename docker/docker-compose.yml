services:
  # Daemon owns collection, snapshots and the Stress Controller. Docker socket
  # access is added only by docker-compose.stress.yml.
  catmonitor:
    image: ${CATMONITOR_IMAGE:-catmonitor-generic}
    privileged: true
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro
      - /etc/os-release:/etc/os-release:ro
      - snapshot:/var/lib/catmonitor/snapshot
      - data:/var/lib/catmonitor/data
      - straggler:/var/lib/catmonitor/straggler
      - control:/run/catmonitor
    restart: unless-stopped

  # One Web process serves monitoring and Stress read/write APIs on :19322.
  # It is a client of the daemon control API and receives no Docker socket.
  web:
    image: ${CATMONITOR_IMAGE:-catmonitor-generic}
    network_mode: host
    entrypoint: /usr/local/bin/web
    command: >
      -addr=${CATMONITOR_WEB_ADDR:-:19322}
      -snapshot-dir=/var/lib/catmonitor/snapshot
      -control-socket=/run/catmonitor/control.sock
    volumes:
      - snapshot:/var/lib/catmonitor/snapshot:ro
      - control:/run/catmonitor:ro
    depends_on:
      - catmonitor
    restart: unless-stopped

  dfee:
    image: ${CATMONITOR_IMAGE:-catmonitor-generic}
    network_mode: host
    entrypoint: /usr/local/bin/dfee
    command: >
      -addr=:19323
      -snapshot-dir=/var/lib/catmonitor/snapshot
      -exporter=enabled
      -exporter-port=9333
      -csv=disabled
      -csv-dir=/var/lib/catmonitor/csv
      -csv-interval=10s
    volumes:
      - snapshot:/var/lib/catmonitor/snapshot:ro
      - csv:/var/lib/catmonitor/csv
    depends_on:
      - catmonitor
    restart: unless-stopped

volumes:
  snapshot:
  data:
  csv:
  straggler:
  control:
