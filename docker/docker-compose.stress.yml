# Reliability Stress execution plane. Combine with docker-compose.yml and opt
# into one or both profiles:
#   docker compose --profile stress-cpu up -d
#   docker compose --profile stress-cpu --profile stress-npu up -d
services:
  catmonitor:
    volumes:
      # Temporary V2 security debt: only the daemon/controller receives this
      # root-equivalent socket. Web and DFeE never receive it.
      - type: bind
        source: ${CATMONITOR_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false

      - type: bind
        source: ${CATMONITOR_STRESS_STATE_DIR:-/var/lib/catmonitor/stress}
        target: /var/lib/catmonitor/stress
        bind:
          create_host_path: false

  catmonitor-stress-cpu:
    profiles: ["stress-cpu"]
    container_name: catmonitor-stress-cpu
    image: ${CATMONITOR_CPU_STRESS_IMAGE:-catmonitor/stress-cpu:configure-me}
    restart: unless-stopped
    read_only: true
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETPCAP", "SETUID", "SYS_NICE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: ${CATMONITOR_CPU_STRESS_PIDS_LIMIT:-4096}
    shm_size: ${CATMONITOR_CPU_STRESS_SHM_SIZE:-16gb}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      STREAM_THREADS: ${CATMONITOR_STREAM_THREADS:-0}
      HPL_MPI_PROCESSES: ${CATMONITOR_HPL_MPI_PROCESSES:-1}
      HPL_THREADS_PER_PROCESS: ${CATMONITOR_HPL_THREADS_PER_PROCESS:-1}
      HPCG_MPI_PROCESSES: ${CATMONITOR_HPCG_MPI_PROCESSES:-1}
      HPCG_THREADS_PER_PROCESS: ${CATMONITOR_HPCG_THREADS_PER_PROCESS:-1}
      HPCG_NX: ${CATMONITOR_HPCG_NX:-32}
      HPCG_NY: ${CATMONITOR_HPCG_NY:-32}
      HPCG_NZ: ${CATMONITOR_HPCG_NZ:-32}
      HPCG_RUNTIME_SECONDS: ${CATMONITOR_HPCG_RUNTIME_SECONDS:-60}
    volumes:
      - stress_cpu_state:/var/lib/catmonitor/stress
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/setpriv",
          "--bounding-set=-all",
          "--inh-caps=-all",
          "--ambient-caps=-all",
          "--reuid=65532",
          "--regid=65532",
          "--init-groups",
          "--no-new-privs",
          "/usr/local/bin/catmonitor-stress-exec",
          "describe",
          "--benchmark",
          "stream",
          "--json",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The generated A2/A3 overlay supplies devices and identity-mapped
  # /dev/davinciN entries. The canonical service contains no device-count
  # assumptions.
  catmonitor-stress-npu:
    profiles: ["stress-npu"]
    container_name: catmonitor-stress-npu
    image: ${CATMONITOR_NPU_STRESS_IMAGE:-catmonitor/npuburn:configure-me}
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    environment:
      NPU_BURN_DEVICE: ${CATMONITOR_NPU_BURN_DEVICE:-}
      NPU_BURN_RUN_CASE: ${CATMONITOR_NPU_BURN_RUN_CASE:-matmul}
      NPU_BURN_GROUP: ${CATMONITOR_NPU_BURN_GROUP:-}
      NPU_BURN_CHIP_GENERATION: ${CATMONITOR_NPU_BURN_CHIP_GENERATION:-}
      NPU_BURN_INTERNAL_TIMEOUT_SECONDS: ${CATMONITOR_NPU_BURN_INTERNAL_TIMEOUT_SECONDS:-300}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    volumes:
      - stress_npu_state:/var/lib/catmonitor/stress
      - stress_npu_output:/opt/catmonitor/npuburn-home/.ascend_npu_burn/output
      - /sys/bus/pci:/sys/bus/pci:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/catmonitor-stress-exec", "describe", "--json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  stress_cpu_state:
  stress_npu_state:
  stress_npu_output:
